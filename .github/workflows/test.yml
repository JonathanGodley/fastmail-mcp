name: test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Read-only: this workflow only checks out, builds, and runs the test suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A glob that matches nothing must never read as a passing suite. The test
      # script's pattern is expanded by the runner's shell, so a pattern that
      # works on one platform can silently select zero files on another; this
      # step fails loudly instead, and pins the floor against a wholesale loss
      # of test files.
      - name: Check the test glob still selects the suite
        run: |
          count=$(ls src/*.test.ts | wc -l)
          echo "test files matched: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::src/*.test.ts matched $count files; the suite has 20+. The glob is wrong or test files have been lost."
            exit 1
          fi

      - name: Test
        run: npm test
