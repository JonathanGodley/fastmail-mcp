name: Build and Release DXT

# Publishes the .dxt extension users actually install. Releases here are
# deliberately human-initiated: a pushed tag or a manual dispatch, never a push
# to a branch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default. The job below opts up to contents: write because it
# publishes the release asset. Permissions are granted per job, so that scope
# bounds every step — but the token itself is NOT ambient: Actions does not put
# GITHUB_TOKEN into a run: step's environment, it materializes only where a step
# references secrets.GITHUB_TOKEN or github.token. In this file that is exactly
# one place, the release step's env:, so npm ci and the pack step hold no
# write-capable credential at all. The checkout also carries no pushable git
# credential (persist-credentials: false), and the artifact is gated on the test
# suite and the secret scan before anything is packed.
#
# The residual worth knowing is therefore about artifact content, not token
# reach: npm ci runs third-party install scripts in the same workspace that is
# about to be packed, so a compromised dependency could alter dist/ before pack.
# Splitting the jobs would not change that — it is why the pack tool is pinned
# by exact version and the release is gated behind the scan.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the .dxt to it
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No step here pushes to the repository, so the checkout has no use
          # for a stored git credential. Leaving one behind would hand push
          # access to `npm ci` and to `npx --yes`, both of which execute code
          # downloaded at run time.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gates, before anything is packed. A published extension that ships a
      # failing test or a committed credential is the failure these prevent,
      # and a release is the last point at which it can still be stopped.
      - name: Test
        run: npm test

      - name: Scan for secrets and personal information
        run: npm run scan:secrets

      # .dxtignore keeps source and docs out of the archive but nothing there
      # removes the devDependency tree, so without this the published extension
      # carries the full dev install. It has to run after the build and the
      # tests, which need the compiler and the test runner — both dev-only.
      - name: Drop devDependencies from the packaged tree
        run: npm prune --omit=dev

      - name: Pack DXT
        run: npx --yes @anthropic-ai/dxt@0.2.6 pack

      - name: Compute version and rename artifact
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE=$(ls -1 *.dxt | head -n1)
          mv "$FILE" "fastmail-mcp-$VERSION.dxt"
          echo "DXT_FILE=fastmail-mcp-$VERSION.dxt" >> $GITHUB_ENV

      # Boot the archive that is about to be published, not the working tree it
      # was built from. This is what catches a .dxtignore pattern that strips
      # something the runtime needs — an unanchored directory pattern once
      # removed node_modules/debug/src/ and produced a .dxt that crashed on
      # boot, which nothing else in this workflow would have noticed.
      - name: Boot-smoke the packed artifact
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          unzip -q "$DXT_FILE" -d "$WORK"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"dxt-smoke","version":"0.0.0"}}}'
          # Running the entry point from inside the unpacked archive is the
          # point: bare imports resolve against the archive's own node_modules,
          # so a dependency the pack dropped fails here rather than on a user's
          # machine.
          #
          # The server answers initialize and exits 0 when stdin closes; the
          # timeout is only a backstop against a hung process. Exit 124 means
          # timeout killed a server that started but never let go of stdio —
          # still judged by whether it produced a valid initialize response.
          # Any other non-zero exit is a startup crash and fails the job.
          rc=0
          OUT="$(printf '%s\n' "$REQ" | timeout 60s node "$WORK/dist/index.js")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "packed server exited with status $rc before answering initialize" >&2
            exit "$rc"
          fi
          if ! grep -q '"serverInfo"' <<< "$OUT"; then
            echo "no initialize response from the packed server (exit status $rc)" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastmail-mcp-dxt
          path: ${{ env.DXT_FILE }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ env.DXT_FILE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
