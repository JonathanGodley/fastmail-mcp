name: Build and Release DXT

# Publishes the .dxt extension users actually install. Releases here are
# deliberately human-initiated: a pushed tag or a manual dispatch, never a push
# to a branch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default, and now scoped that way in practice rather than only on
# paper. Split into two jobs so that only the job that actually publishes the
# release runs with contents: write.
#
# GITHUB_TOKEN is not ambient in a run: step - Actions does not put it into the
# environment, so npm ci and the pack step hold no credential either way. It IS
# an implicit default input on actions/checkout and actions/setup-node at the
# SHAs pinned below (github.token, and github.token when the server is
# github.com, respectively), so those two actions reach the token regardless of
# which job they run in - but the build job below asks for contents: read, so
# they now run read-scoped instead of write-scoped. Only the release job asks
# for contents: write, because its publish step needs it - that scope applies
# to the whole job, so both steps above the publish step (download and
# verify) run write-scoped too, not only the one that needs it. It stays
# narrow anyway: the job does no checkout of its own, so there is no working
# tree and no stored git credential for the token to act through -
# action-gh-release does not read a tree either.
#
# The release job runs on every trigger, including workflow_dispatch. The
# artifact upload/download runs unconditionally regardless of the tag gate,
# and so does the "Verify the artifact name crossed the job boundary" step
# below: it reads `needs.build.outputs.dxt_file` with no `if:` of its own,
# unlike the publish step, whose `with:` block - the only other reader of
# that output - is only evaluated on a tagged push. So a dispatch run still
# proves the output resolves to a non-empty value naming a file that actually
# landed in the job's workspace, which is the hand-off this split depends on
# - it does not exercise the publish step itself, only what feeds it.
#
# A separate residual, which the split does not address, is artifact content
# rather than token reach: npm ci runs third-party install scripts in the same
# workspace that is about to be packed, so a compromised dependency could alter
# dist/ before pack. That is why the pack tool is pinned by exact version and
# the release is gated behind the scan.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dxt_file: ${{ steps.compute-version.outputs.dxt_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No step here pushes to the repository, so the checkout has no use
          # for a stored git credential. Leaving one behind would hand push
          # access to `npm ci` and to `npx --yes`, both of which execute code
          # downloaded at run time.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gates, before anything is packed. A published extension that ships a
      # failing test or a committed credential is the failure these prevent,
      # and a release is the last point at which it can still be stopped.
      - name: Test
        run: npm test

      - name: Scan for secrets and personal information
        run: npm run scan:secrets

      # .dxtignore keeps source and docs out of the archive but nothing there
      # removes the devDependency tree, so without this the published extension
      # carries the full dev install. It has to run after the build and the
      # tests, which need the compiler and the test runner — both dev-only.
      - name: Drop devDependencies from the packaged tree
        run: npm prune --omit=dev

      - name: Pack DXT
        run: npx --yes @anthropic-ai/dxt@0.2.6 pack

      - name: Compute version and rename artifact
        id: compute-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE=$(ls -1 *.dxt | head -n1)
          mv "$FILE" "fastmail-mcp-$VERSION.dxt"
          echo "DXT_FILE=fastmail-mcp-$VERSION.dxt" >> $GITHUB_ENV
          echo "dxt_file=fastmail-mcp-$VERSION.dxt" >> $GITHUB_OUTPUT

      # Boot the archive that is about to be published, not the working tree it
      # was built from. This is what catches a .dxtignore pattern that strips
      # something the runtime needs — an unanchored directory pattern once
      # removed node_modules/debug/src/ and produced a .dxt that crashed on
      # boot, which nothing else in this workflow would have noticed.
      - name: Boot-smoke the packed artifact
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          unzip -q "$DXT_FILE" -d "$WORK"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"dxt-smoke","version":"0.0.0"}}}'
          # Running the entry point from inside the unpacked archive is the
          # point: bare imports resolve against the archive's own node_modules,
          # so a dependency the pack dropped fails here rather than on a user's
          # machine.
          #
          # The server answers initialize and exits 0 when stdin closes; the
          # timeout is only a backstop against a hung process. Exit 124 means
          # timeout killed a server that started but never let go of stdio —
          # still judged by whether it produced a valid initialize response.
          # Any other non-zero exit is a startup crash and fails the job.
          rc=0
          OUT="$(printf '%s\n' "$REQ" | timeout 60s node "$WORK/dist/index.js")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "packed server exited with status $rc before answering initialize" >&2
            exit "$rc"
          fi
          if ! grep -q '"serverInfo"' <<< "$OUT"; then
            echo "no initialize response from the packed server (exit status $rc)" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastmail-mcp-dxt
          path: ${{ env.DXT_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the .dxt to it
    steps:
      # No checkout here - action-gh-release below does not read the tree,
      # which is most of what makes this job's write scope narrow: no working
      # tree, no stored git credential for the token to act through.
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastmail-mcp-dxt

      # Guards the filename hand-off itself, unconditionally - no tag gate. The publish
      # step below is the only other reader of `needs.build.outputs.dxt_file`, and it is
      # skipped on everything but a tagged push, so without this the hand-off this split
      # depends on would go unexercised on every workflow_dispatch run and uncaught on a
      # tagged one too: an empty `files:` is not itself an error, so a broken hand-off
      # would publish a release with nothing attached, silently.
      #
      # Bound through env: rather than interpolated straight into the run: body, even
      # though this value only ever comes from package.json's version string today -
      # Actions expands an interpolated `${{ }}` into the script as source text before the
      # shell runs it, in a job that holds contents: write, so there is no reason to take
      # that path when passing it as data through the environment works just as well.
      - name: Verify the artifact name crossed the job boundary
        env:
          DXT_FILE: ${{ needs.build.outputs.dxt_file }}
        run: |
          test -n "$DXT_FILE"
          test -f "$DXT_FILE"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ needs.build.outputs.dxt_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
