name: Build and Release DXT

# Publishes the .dxt extension. Deliberately human-initiated: a pushed tag or a
# manual dispatch, never a push to a branch.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout and actions/setup-node receive the repository token as
      # a default input whatever the job's permissions, so this scope is what
      # keeps it read-only. Actions puts no GITHUB_TOKEN into a run: step's
      # environment unless one is bound, and none here is.
      contents: read
    outputs:
      # $GITHUB_ENV (set in compute-version below) only threads a value within
      # this job - reaching the release job needs a job output instead.
      dxt_file: ${{ steps.compute-version.outputs.dxt_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A stored credential would hand push access to `npm ci` and
          # `npx --yes`, both of which run code downloaded at run time.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci runs third-party install scripts in the workspace that gets
      # packed, so the pack tool is pinned by exact version and the release is
      # gated behind the secret/PII scan.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gates, before anything is packed.
      - name: Test
        run: npm test

      - name: Scan for secrets and personal information
        run: npm run scan:secrets

      # .dxtignore does not remove the devDependency tree. Runs after the build
      # and the tests, which need dev-only tools.
      - name: Drop devDependencies from the packaged tree
        run: npm prune --omit=dev

      - name: Pack DXT
        run: npx --yes @anthropic-ai/dxt@0.2.6 pack

      - name: Compute version and rename artifact
        id: compute-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE=$(ls -1 *.dxt | head -n1)
          mv "$FILE" "fastmail-mcp-$VERSION.dxt"
          echo "DXT_FILE=fastmail-mcp-$VERSION.dxt" >> $GITHUB_ENV
          echo "dxt_file=fastmail-mcp-$VERSION.dxt" >> $GITHUB_OUTPUT

      # Boot the archive about to be published, not the working tree: this
      # catches a .dxtignore pattern that strips something the runtime needs
      # (an unanchored pattern once removed node_modules/debug/src/).
      - name: Boot-smoke the packed artifact
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          unzip -q "$DXT_FILE" -d "$WORK"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"dxt-smoke","version":"0.0.0"}}}'
          # Running the entry point from inside the unpacked archive is the
          # point: bare imports resolve against the archive's own node_modules,
          # so a dependency the pack dropped fails here rather than on a user's
          # machine.
          #
          # The server answers initialize and exits 0 when stdin closes; the
          # timeout is only a backstop against a hung process. Exit 124 means
          # timeout killed a server that started but never let go of stdio —
          # still judged by whether it produced a valid initialize response.
          # Any other non-zero exit is a startup crash and fails the job.
          rc=0
          OUT="$(printf '%s\n' "$REQ" | timeout 60s node "$WORK/dist/index.js")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "packed server exited with status $rc before answering initialize" >&2
            exit "$rc"
          fi
          if ! grep -q '"serverInfo"' <<< "$OUT"; then
            echo "no initialize response from the packed server (exit status $rc)" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastmail-mcp-dxt
          path: ${{ env.DXT_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the .dxt to it
    steps:
      # No checkout: no working tree and no stored git credential for this
      # job's write-scoped token to act through.
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastmail-mcp-dxt

      # Unconditional, no tag gate: an empty `files:` below is not an error, so a
      # broken hand-off would silently publish a release with nothing attached,
      # and a workflow_dispatch run would never exercise it.
      #
      # Bound through env: because an interpolated `${{ }}` is expanded into the
      # script as source text, in a job that holds contents: write.
      - name: Verify the artifact name crossed the job boundary
        env:
          DXT_FILE: ${{ needs.build.outputs.dxt_file }}
        run: |
          test -n "$DXT_FILE"
          test -f "$DXT_FILE"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          # Notes are written by hand in the release procedure; this only attaches the .dxt.
          files: ${{ needs.build.outputs.dxt_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
