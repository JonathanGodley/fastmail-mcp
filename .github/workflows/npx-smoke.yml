name: npx smoke

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Read-only: this workflow only checks out and runs a smoke test.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Pack and smoke the CLI
        shell: bash
        run: |
          set -euo pipefail
          # Install from the packed tarball rather than "npx github:<repo>":
          # npm's GitFetcher cannot pack a git dependency with a prepare script
          # from npx ("GitFetcher requires an Arborist constructor"), so the
          # github: form never worked in CI. The tarball exercises the same
          # surface — prepare/tsc build, the files allowlist, and bin wiring.
          npm ci
          npm pack
          TARBALL="$(ls fastmail-mcp-*.tgz)"
          export HOME="$(mktemp -d)"
          # Install the tarball as its own step, with its own timeout, and run
          # the installed bin afterwards. A single `npx --yes <tarball>` under
          # one timeout could not say which half stalled: on 4 Sep 2026 one
          # matrix leg per run timed out with no output at all, and the log
          # could not separate a registry fetch stall from a server that never
          # started. 300s is generous for a fresh install of five runtime
          # dependencies (it takes ~5s when the registry is healthy), so hitting
          # it is a fetch problem, never a server fault.
          INSTALL_DIR="$(mktemp -d)"
          rc=0
          timeout 300s npm install --prefix "$INSTALL_DIR" --no-audit --no-fund "./$TARBALL" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "tarball install failed or stalled (exit status $rc); the server was never run" >&2
            exit "$rc"
          fi
          BIN="$INSTALL_DIR/node_modules/.bin/fastmail-mcp"
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"npx-smoke","version":"0.0.0"}}}'
          # The server answers initialize and exits 0 when stdin closes; the
          # timeout is only a backstop against a hung process. Exit 124 means
          # timeout killed a server that started but never let go of stdio —
          # still judged by whether it produced a valid initialize response.
          # Any other non-zero exit is a startup crash and fails the job.
          rc=0
          OUT="$(printf '%s\n' "$REQ" | timeout 60s "$BIN")" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "server exited with status $rc before answering initialize" >&2
            exit "$rc"
          fi
          if ! grep -q '"serverInfo"' <<< "$OUT"; then
            echo "no initialize response from server (exit status $rc)" >&2
            exit 1
          fi

